{% extends 'base.html' %}

{% block content %}

<h2>Add Product</h2>

<form method="POST">

    {% csrf_token %}

    <label>Product Name</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Price</label>
    <input type="number" name="price" required>

    <br><br>

    <label>Stock Quantity</label>
    <input type="number" name="stock" required>

    <br><br>

    <button type="submit">Save Product</button>

</form>

{% endblock %}
