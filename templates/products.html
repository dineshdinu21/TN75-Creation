{% extends 'base.html' %}

{% block content %}

<style>
    /* Form Container Design */
    .form-container {
        max-width: 500px;
        margin: 30px auto;
        padding: 30px;
        background-color: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        border-radius: 12px;
    }

    .form-container h2 {
        margin-bottom: 25px;
        color: #333;
        text-align: center;
        font-family: 'Arial', sans-serif;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
    }

    /* Input Styling */
    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box; /* Padding-nala width maarama iruka */
    }

    .form-control:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 5px rgba(0,123,255,0.2);
    }

    /* Button Styling */
    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }

    .btn-submit:hover {
        background-color: #0056b3;
    }

    /* Icon or Helper text style */
    .helper-text {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
    }
</style>

<div class="form-container">
    <h2>Add New Product</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="name" class="form-control" placeholder="Ex: Cotton Shirt" required>
        </div>

        <div class="form-group">
            <label>Default Price (₹)</label>
            <input type="number" name="price" class="form-control" placeholder="Enter original rate" required>
            <p class="helper-text">Ithu thaan sales-la default-a varum.</p>
        </div>

        <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" name="stock" class="form-control" placeholder="Ex: 50" required>
        </div>

        <button type="submit" class="btn-submit">Save Product</button>
    </form>
</div>

{% endblock %}
