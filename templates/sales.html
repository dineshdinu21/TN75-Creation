{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
    .status-paid { 
        color: #28a745; font-weight: bold; 
    } 
    .status-unpaid { 
        color: #dc3545; font-weight: bold; 
    } 
    .form-group { 
        margin-bottom: 15px; 
    }
    label { 
        display: inline-block; width: 120px; 
    }
</style>

<h2>Add Sale</h2>

<form method="POST">
    {% csrf_token %}

    <div class="form-group">
        <label>Customer Name</label>
        <input type="text" name="customer_name" required>
    </div>

    <div class="form-group">
        <label>Select Product</label>
        <select name="product">
            {% for product in products %}
            <option value="{{ product.id }}">
                {{ product.name }} (Rate: {{ product.price }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Quantity</label>
        <input type="number" name="quantity" required>
    </div>

    <div class="form-group">
        <label>Custom Price</label>
        <input type="number" name="price">
    </div>

    <div class="form-group">
        <label>Status</label>
        <select name="status">
            <option value="True" class="status-paid">Paid</option>
            <option value="False" class="status-unpaid">Unpaid</option>
        </select>
    </div>

    <br>
    <button type="submit" style="padding: 10px 20px; background-color: #771818f7; color: white; border: none; border-radius: 4px;">
        Save Sale
    </button>
</form>

{% endblock %}
